name: Build

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v3
        with:
          channel: stable
          flutter-version: '3.44.2'
          cache: true

      - name: Create stub .env
        run: printf 'GEMINI_API_KEY=\n' > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uangku-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v3
        with:
          channel: stable
          flutter-version: '3.44.2'
          cache: true

      - name: Create stub .env
        run: printf 'GEMINI_API_KEY=\n' > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build iOS app (debug, no codesign)
        run: flutter build ios --debug --no-codesign

      - name: Archive Runner.app
        run: ditto -c -k build/ios/iphoneos/Runner.app build/ios/iphoneos/Runner.app.zip

      - name: Upload iOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: uangku-ios-app
          path: build/ios/iphoneos/Runner.app.zip