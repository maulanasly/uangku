name: uangku
description: "A personal Money Tracker application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^3.4.2
  
  # Navigation
  go_router: ^17.5.0
  
  # Database
  drift: ^2.34.3
  sqlite3: ^3.5.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # Features
  image_picker: ^1.2.3
  fl_chart: ^1.2.0
  
  # Utils
  intl: ^0.20.3
  share_plus: ^13.3.0
  csv: ^8.0.0
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^6.0.1
  file_picker: ^12.0.0-beta.7
  shared_preferences: ^2.2.2
  google_mlkit_text_recognition: ^0.16.0
  apple_vision_recognize_text: ^0.1.0
  http: ^1.6.0
  flutter_image_compress: ^2.5.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  
  # Lints
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
